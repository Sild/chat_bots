services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitsmart-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/splitsmart.db
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - splitsmart_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  splitsmart_data:
