<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SplitSmart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:wght@500;700&display=swap');

    :root {
      --bg-1: #f7f2e8;
      --bg-2: #f2f7fb;
      --ink: #1c1c1c;
      --muted: #5f5f5f;
      --accent: #0a7b65;
      --accent-2: #d7a60e;
      --card: #ffffff;
      --line: #e0e0e0;
      --danger: #b21b3a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 800px at 20% 10%, var(--bg-1), transparent),
                  radial-gradient(1000px 700px at 80% 0%, var(--bg-2), transparent),
                  #fdfcf8;
      min-height: 100vh;
    }

    .frame {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-size: 32px;
      margin: 0;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .value {
      font-size: 24px;
      font-weight: 700;
    }

    .section {
      margin-top: 20px;
    }

    .section h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 8px;
    }

    .row:last-child { border-bottom: none; padding-bottom: 0; }

    .pill {
      background: #f4f4f4;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
    }

    button {
      font-family: "Space Grotesk", sans-serif;
      background: var(--accent);
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: #f1f1f1;
      color: var(--ink);
    }

    button.warning {
      background: var(--accent-2);
      color: #2b1f00;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      background: #ffe5ea;
      color: var(--danger);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      margin-bottom: 12px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }

    .modal-card {
      background: white;
      width: min(680px, 100%);
      border-radius: 16px;
      padding: 20px;
      max-height: 90vh;
      overflow: auto;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    input, select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-family: "Space Grotesk", sans-serif;
    }

    .splits {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 8px 12px;
      align-items: center;
    }

    .muted { color: var(--muted); font-size: 12px; }

    @media (max-width: 600px) {
      header { align-items: flex-start; }
      .row { flex-direction: column; align-items: flex-start; }
      .splits { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="frame">
    <header>
      <div>
        <h1>SplitSmart</h1>
        <div class="sub" id="chatTitle">Loading chat...</div>
      </div>
      <button id="addSpendBtn">Add spend</button>
    </header>

    <div class="error" id="errorBox"></div>

    <div class="grid">
      <div class="card">
        <div class="label">Spends</div>
        <div class="value" id="spendsCount">0</div>
      </div>
      <div class="card">
        <div class="label">Participants</div>
        <div class="value" id="participantsCount">0</div>
      </div>
      <div class="card">
        <div class="label">Session</div>
        <div class="value" id="sessionId">-</div>
      </div>
    </div>

    <div class="card section">
      <h2>Balances</h2>
      <div class="list" id="balances"></div>
    </div>

    <div class="card section">
      <h2>Transfers</h2>
      <div class="list" id="transfers"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <h2>Add spend</h2>
      <div class="form-row">
        <label>Total</label>
        <input id="totalInput" placeholder="12.34" />
        <div class="pill" id="modePill">Mode: ABS</div>
        <button class="secondary" id="toggleMode">Toggle ABS/PERCENT</button>
      </div>
      <div class="form-row">
        <label>Payer</label>
        <select id="payerSelect"></select>
        <button class="secondary" id="equalSplit">Equal split</button>
      </div>
      <div class="muted" id="splitHint">Split values must sum to total.</div>
      <div class="splits" id="splitsGrid"></div>
      <div class="form-row" style="justify-content: flex-end;">
        <button class="secondary" id="cancelModal">Cancel</button>
        <button id="submitSpend">Submit</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const state = {
      chatId: null,
      initData: tg?.initData || "",
      mode: "ABS",
      data: null,
    };

    const chatTitleEl = document.getElementById("chatTitle");
    const errorBox = document.getElementById("errorBox");
    const spendsCount = document.getElementById("spendsCount");
    const participantsCount = document.getElementById("participantsCount");
    const sessionId = document.getElementById("sessionId");
    const balancesEl = document.getElementById("balances");
    const transfersEl = document.getElementById("transfers");

    const modal = document.getElementById("modal");
    const totalInput = document.getElementById("totalInput");
    const modePill = document.getElementById("modePill");
    const toggleModeBtn = document.getElementById("toggleMode");
    const payerSelect = document.getElementById("payerSelect");
    const splitsGrid = document.getElementById("splitsGrid");
    const splitHint = document.getElementById("splitHint");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    function formatCents(cents) {
      const sign = cents < 0 ? "-" : "";
      const abs = Math.abs(cents);
      const whole = Math.floor(abs / 100);
      const frac = String(abs % 100).padStart(2, "0");
      return `${sign}${whole}.${frac}`;
    }

    function parseMoneyToCents(value) {
      const cleaned = value.trim();
      if (!cleaned) return null;
      if (!/^\d+(\.\d{1,2})?$/.test(cleaned)) return null;
      const parts = cleaned.split(".");
      const whole = parseInt(parts[0], 10);
      const frac = parts[1] ? parts[1].padEnd(2, "0") : "00";
      return whole * 100 + parseInt(frac, 10);
    }

    async function postJson(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data.error || "Request failed";
        throw new Error(msg);
      }
      return data;
    }

    function render(data) {
      state.data = data;
      chatTitleEl.textContent = data.chat.title || `Chat ${data.chat.chat_id}`;
      spendsCount.textContent = data.spends_count;
      participantsCount.textContent = data.participants.length;
      sessionId.textContent = data.session.id;

      balancesEl.innerHTML = "";
      data.balances.forEach((b) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<div>${b.display_name}</div><div>${formatCents(b.net_cents)}</div>`;
        balancesEl.appendChild(row);
      });

      transfersEl.innerHTML = "";
      if (data.transfers.length === 0) {
        transfersEl.innerHTML = "<div class=\"muted\">No transfers needed</div>";
      } else {
        data.transfers.forEach((t) => {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<div>${t.from_name} -> ${t.to_name}</div><div>${formatCents(t.amount_cents)}</div>`;
          transfersEl.appendChild(row);
        });
      }
    }

    function openModal() {
      if (!state.data) return;
      totalInput.value = "";
      modePill.textContent = `Mode: ${state.mode}`;
      splitHint.textContent = state.mode === "ABS"
        ? "Split values must sum to total."
        : "Split values must sum to 100 percent.";
      payerSelect.innerHTML = "";
      state.data.participants.forEach((p) => {
        const option = document.createElement("option");
        option.value = p.user_id;
        option.textContent = p.display_name;
        if (p.user_id === state.data.participant.user_id) option.selected = true;
        payerSelect.appendChild(option);
      });
      renderSplits();
      modal.style.display = "flex";
    }

    function renderSplits() {
      splitsGrid.innerHTML = "";
      state.data.participants.forEach((p) => {
        const label = document.createElement("div");
        label.textContent = p.display_name;
        const input = document.createElement("input");
        input.type = "text";
        input.dataset.userId = p.user_id;
        input.placeholder = state.mode === "ABS" ? "0.00" : "0";
        splitsGrid.appendChild(label);
        splitsGrid.appendChild(input);
      });
    }

    function applyEqualSplit() {
      const inputs = Array.from(splitsGrid.querySelectorAll("input"));
      if (state.mode === "ABS") {
        const cents = parseMoneyToCents(totalInput.value);
        if (cents === null) {
          showError("Enter a valid total to split equally.");
          return;
        }
        const base = Math.floor(cents / inputs.length);
        let remainder = cents - base * inputs.length;
        inputs.forEach((input) => {
          let value = base;
          if (remainder > 0) {
            value += 1;
            remainder -= 1;
          }
          input.value = formatCents(value);
        });
      } else {
        const per = Math.floor((10000 / inputs.length));
        let remainder = 10000 - per * inputs.length;
        inputs.forEach((input) => {
          let value = per;
          if (remainder > 0) {
            value += 1;
            remainder -= 1;
          }
          input.value = (value / 100).toFixed(2);
        });
      }
      clearError();
    }

    async function submitSpend() {
      const total = totalInput.value.trim();
      const splits = Array.from(splitsGrid.querySelectorAll("input")).map((input) => ({
        user_id: parseInt(input.dataset.userId, 10),
        value: input.value.trim(),
      }));
      const payload = {
        chat_id: state.chatId,
        init_data: state.initData,
        total,
        mode: state.mode,
        payer_user_id: parseInt(payerSelect.value, 10),
        splits,
      };
      try {
        const data = await postJson("/api/spends", payload);
        render(data);
        modal.style.display = "none";
        clearError();
      } catch (err) {
        showError(err.message);
      }
    }

    async function bootstrap() {
      try {
        const data = await postJson("/api/bootstrap", {
          chat_id: state.chatId,
          init_data: state.initData,
        });
        render(data);
      } catch (err) {
        showError(err.message);
      }
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      state.chatId = parseInt(params.get("chat_id"), 10);
      if (!state.chatId) {
        showError("Missing chat_id in URL.");
        return;
      }
      bootstrap();
    }

    document.getElementById("addSpendBtn").addEventListener("click", openModal);
    document.getElementById("cancelModal").addEventListener("click", () => { modal.style.display = "none"; });
    document.getElementById("submitSpend").addEventListener("click", submitSpend);
    toggleModeBtn.addEventListener("click", () => {
      state.mode = state.mode === "ABS" ? "PERCENT" : "ABS";
      modePill.textContent = `Mode: ${state.mode}`;
      splitHint.textContent = state.mode === "ABS"
        ? "Split values must sum to total."
        : "Split values must sum to 100 percent.";
      renderSplits();
    });
    document.getElementById("equalSplit").addEventListener("click", applyEqualSplit);

    init();
  </script>
</body>
</html>
